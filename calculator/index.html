<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="calculator">
    <div class="input-row">
        <input type="number" id="num1" placeholder="123">
        <select id="operation">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
        </select>
        <input type="number" id="num2" placeholder="456">
    </div>
    <button id="calculateBtn">подсчитать</button>
    <div class="history">
        <div id="historyList"></div>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
